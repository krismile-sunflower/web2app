name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: 还原签名密钥（GitHub Secrets）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/web2app.keystore
      - name: Gradle assembleDebug
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"
      - name: 重命名 APK（固定下载文件名）
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk web2app.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "web2app-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: web2app-debug-apk
          path: web2app.apk
      - name: 发布到 Releases（滚动更新 latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest web2app.apk "web2app-1.0.${{ github.run_number }}.apk" \
            --title "网页盒子 1.0.${{ github.run_number }}" \
            --notes "版本 1.0.${{ github.run_number }}（build ${{ github.run_number }}），自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，commit ${GITHUB_SHA::7}。
          versionCode 随构建号递增，可直接覆盖安装，无需卸载旧版。
          固定下载链接：https://github.com/${{ github.repository }}/releases/latest/download/web2app.apk"
      - name: 确保 Release 已发布（草稿会导致固定链接 404）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit latest --draft=false
          if [ "$(gh release view latest --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::Release 仍是草稿状态，固定下载链接会 404"
            exit 1
          fi

  ios-build:
    name: iOS 编译校验（模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: xcodebuild（iOS Simulator）
        working-directory: ios/App
        run: >
          xcodebuild
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v4
        with:
          name: web2app-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
